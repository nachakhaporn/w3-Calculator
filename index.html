<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Calculator</title>
</head>


<body class="min-h-screen bg-white p-2.5 sm:p-6 grid place-items-center">
   <!-- Calculator -->
    <main class="w-full max-w-[694px] rounded-[26px] sm:rounded-[38px] border-4 border-black bg-[#f1f1f1] px-4 py-7 sm:px-[30px] sm:pb-[38px] sm:pt-[50px]" aria-label="Calculator">
        <output class="flex min-h-[107px] items-center justify-end overflow-hidden rounded-2xl border border-black bg-[#e1fcff] px-5 py-3 text-[clamp(3rem,7vw,4rem)] tabular-nums" id="display" aria-live="polite">0</output>
        
        <!-- Keypad -->
        <div class="mt-6 grid grid-cols-5 grid-rows-[repeat(5,108px)] gap-x-[21px] gap-y-3 sm:mt-9 sm:gap-y-[26px]">
            <!-- Memory Pad -->
            <section class="col-span-5 grid grid-cols-5 gap-x-2 sm:gap-x-[21px]" aria-label="Memory controls">
                <button class="key key-memory" type="button" data-action="memory-clear">MC</button>
                <button class="key key-memory" type="button" data-action="memory-recall">MR</button>
                <button class="key key-memory" type="button" data-action="memory-add">M+</button>
                <button class="key key-memory" type="button" data-action="memory-subtract">M-</button>
                <button class="key key-clear" type="button" data-action="clear">CE</button>
            </section>

            <!-- Number Pad -->
            <section class="col-start-1 row-start-2 col-span-3 row-span-4 grid grid-cols-3 grid-rows-4 gap-2 sm:gap-[21px]" aria-label="Number controls">
                <button class="key key-number" type="button" data-value="7">7</button>
                <button class="key key-number" type="button" data-value="8">8</button>
                <button class="key key-number" type="button" data-value="9">9</button>
                <button class="key key-number" type="button" data-value="4">4</button>
                <button class="key key-number" type="button" data-value="5">5</button>
                <button class="key key-number" type="button" data-value="6">6</button>
                <button class="key key-number" type="button" data-value="1">1</button>
                <button class="key key-number" type="button" data-value="2">2</button>
                <button class="key key-number" type="button" data-value="3">3</button>
                <button class="key key-number key-zero" type="button" data-value="0">0</button>
                <button class="key key-number" type="button" data-action="decimal">.</button>
                <button class="key key-number" type="button" data-action="toggle-sign">+/-</button>
            </section>

            <!-- Operator Pad -->
            <section class="col-start-4 row-start-2 col-span-2 row-span-4 grid grid-cols-2 grid-rows-4 gap-2 sm:gap-[21px]" aria-label="Operator controls">
                <button class="key key-operator" type="button" data-action="divide">÷</button>
                <button class="key key-operator" type="button" data-action="square-root">√</button>
                <button class="key key-operator" type="button" data-action="multiply">×</button>
                <button class="key key-operator" type="button" data-action="percent">%</button>
                <button class="key key-operator" type="button" data-action="subtract">-</button>
                <button class="key key-operator" type="button" data-action="reciprocal">1/x</button>
                <button class="key key-operator" type="button" data-action="add">+</button>
            </section>

            <!-- Equals Button -->
            <button class="key key-equals col-start-5 row-start-5" type="button" data-action="equals">=</button>
        </div>

    </main>

</body>

</html>
